name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    # Dependency-free, so it runs even if package installation is broken.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scan every line ever committed
        run: node scripts/scan-secrets.mjs --history

  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: web-ext lint
        run: npx web-ext lint --source-dir extension --warnings-as-errors
